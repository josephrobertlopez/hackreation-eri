name: "Challenge 01 · Funding gap finder (PHP)"
on:
  push: { paths: ["challenges/01-funding-gap-finder/**", ".github/workflows/challenge-01-*.yml"] }
  pull_request: { paths: ["challenges/01-funding-gap-finder/**"] }
defaults: { run: { working-directory: challenges/01-funding-gap-finder } }
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: { php-version: "8.3", tools: composer }
      - run: composer install --no-interaction --no-progress
      - name: TDD (PHPUnit)
        run: composer test
      - name: BDD (Behat, scenarios tagged with PRD acceptance criteria)
        run: composer bdd
      - name: Smoke (no dependencies)
        run: php tests/smoke.php
      - name: Lint
        run: find src public tests features -name '*.php' -print0 | xargs -0 -n1 php -l
      # Rule 6 ("accessible or it doesn't count") applies to all three
      # challenges, but only 02 and 03 had a browser gate. Added 2026-10-26
      # after axe found landmark-one-main and region violations in this
      # challenge's own hello world, which nothing was checking.
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: challenges/01-funding-gap-finder/package-lock.json }
      - run: npm ci
      - name: Accessibility (Playwright + axe, against php -S)
        run: npx playwright install --with-deps chromium && npm run test:a11y
