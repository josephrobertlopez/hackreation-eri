# Generated by tools/gen_issue_forms.py from docs/eri-backlog.json.
# Do not edit by hand -- regenerate, or the claimable IDs drift away
# from ERI's own document.
name: "Defect in the spec or a conformance test"
description: "A PRD, the backlog, a conformance test or a repo gate is wrong, contradicts ERI's problem statements, or passes something it should fail."
title: "[defect] "
labels:
  - "defect"
body:
  - type: markdown
    attributes:
      value: "Teams find these. The spec is frozen for the event, which makes a defect in it everyone's problem at once rather than one team's, so report it here instead of quietly working around it in your own folder.\n\n**A test that PASSES something it should fail is the worse half of this form.** A gate that cannot go red is not a gate, and every attempt it green-lit is unverified."

  - type: dropdown
    id: surface
    attributes:
      label: "Where is the defect"
      options:
        - "ERI problem statements (docs/eri-problem-statements.md)"
        - "Generated backlog (docs/eri-backlog.md or .json)"
        - "A PRD in wiki/prds/"
        - "A conformance test inside a project folder"
        - "A repo gate (tools/ or .github/workflows/)"
        - "An issue form or the pull request template"
        - "Something else, named below"
    validations:
      required: true

  - type: dropdown
    id: direction
    attributes:
      label: "Which way is it wrong"
      options:
        - "It fails work that is correct (a false red)"
        - "It passes work that is wrong (a false green)"
        - "It contradicts ERI's problem statements"
        - "It is ambiguous: two teams read it two ways"
        - "It cannot run at all"
    validations:
      required: true

  - type: input
    id: location
    attributes:
      label: "File, and line or heading"
      placeholder: "challenges/p2-.../features/tasks.feature:41"
    validations:
      required: true

  - type: input
    id: backlog_ids
    attributes:
      label: "Backlog IDs affected"
      description: "From docs/eri-backlog.md, if any. Blank if the defect is not tied to a requirement."
      placeholder: "P3-F5, P3-US2"

  - type: textarea
    id: evidence
    attributes:
      label: "The command, and what it actually printed"
      description: "Paste the real output. A described failure cannot be reproduced by the person who has to fix it, and during a one-day event that is the difference between fixed and not."
      render: "shell"
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: "What ERI's document says should happen"
      description: "Quote it. The problem statements are the source of truth, so a defect report that cites them is settled in one reading."
    validations:
      required: true

  - type: checkboxes
    id: scope
    attributes:
      label: "Before you file"
      options:
        - label: "This affects everyone attempting the project, not only my branch"
        - label: "I checked ERI's problem statements rather than only the PRD"
        - label: "I can write a failing test that proves it (say so below if you did)"
