# Generated by tools/gen_issue_forms.py from docs/eri-backlog.json.
# Do not edit by hand -- regenerate, or the claimable IDs drift away
# from ERI's own document.
name: "P1 attempt — Show Your Skills"
description: "Declare an attempt at ERI project 1 and claim the backlog IDs it will cover. Several teams may attempt P1; attempts are compared, never merged into each other."
title: "[P1] "
labels:
  - "attempt"
  - "project:p1"
body:
  - type: markdown
    attributes:
      value: "### P1: Show Your Skills\n\nERI's own words for this project are in `docs/eri-problem-statements.md`, under \"Project 1: Show Your Skills\". Where this form and that document disagree, the document wins and this form is a bug.\n\nTick the requirements this attempt will cover. Claim what you intend to finish, not everything that looks interesting: an attempt claiming six features and landing two is harder to judge than one claiming two and landing two."

  - type: input
    id: team
    attributes:
      label: "Team or attempt name"
      description: "Goes in your branch name: attempt/<team>/p1-<short-thing>"
    validations:
      required: true

  - type: textarea
    id: outcome
    attributes:
      label: "What a person will be able to do"
      description: "One or two plain sentences, about the person using it. No architecture, no stack."
    validations:
      required: true

  - type: checkboxes
    id: features
    attributes:
      label: "Core features claimed (6 available)"
      description: "ERI's core-features table for this project, verbatim. The ID before the dash is what your pull request and your tests cite."
      options:
        - label: "P1-F1 — Create a profile: Enter a name or display name, interests, and preferred work activities."
        - label: "P1-F2 — Add skills: Select skills from a list or enter custom skills."
        - label: "P1-F3 — Show examples: Add photos, short videos, audio, or written examples demonstrating a skill."
        - label: "P1-F4 — Describe abilities: Use simple prompts such as \"I am good at…\" and \"Here is something I can do…\""
        - label: "P1-F5 — Preview portfolio: View a simple, employer-friendly presentation."
        - label: "P1-F6 — Share portfolio: Generate a view-only link or downloadable portfolio."

  - type: checkboxes
    id: stories
    attributes:
      label: "User stories claimed (4 available)"
      description: "ERI's user stories for this project, verbatim."
      options:
        - label: "P1-US1 — As a job seeker, I want to show a video of myself completing a work task so employers can see my skills."
        - label: "P1-US2 — As a person who has difficulty writing, I want to use pictures or audio to explain my abilities."
        - label: "P1-US3 — As a job coach, I want to help someone organize their work examples."
        - label: "P1-US4 — As an employer, I want to quickly understand an applicant's skills without navigating a complicated website."

  - type: input
    id: spec_ids
    attributes:
      label: "Frozen-spec IDs this attempt answers (optional)"
      description: "From challenges/p1-*/spec/acceptance.md, if it exists yet: MVP steps, accessibility requirements, success criteria, prohibitions. These are what the attempt is CHECKED against, as opposed to the backlog IDs above, which are what it claims to build. Both belong in the pull request body."
      placeholder: "P1-M3, P1-A4, P1-S1"

  - type: textarea
    id: non_text
    attributes:
      label: "Alternatives to typing, and to reading"
      description: "All four of ERI's projects require an alternative to typed input, and text alternatives for anything that is not text. Say what yours will be: pictures, audio, predefined choices, transcripts, captions."
    validations:
      required: true

  - type: checkboxes
    id: prohibitions
    attributes:
      label: "ERI's prohibitions"
      description: "ERI wrote these. They are not negotiable for a prototype, and they are not a reviewer's job to discover on the last afternoon."
      options:
        - label: "No field, question or required step asks for a disability or diagnosis."
          required: true
        - label: "Nothing scores or ranks candidates."
          required: true
        - label: "Nothing makes an automated hiring or accommodation decision — a person decides."
          required: true

  - type: textarea
    id: known_hard
    attributes:
      label: "Anything you already know will be hard"
      description: "Optional, and the most useful box on this form. Naming the risk up front is how your pull request gets read fairly."
