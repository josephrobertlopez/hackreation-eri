# Generated by tools/gen_issue_forms.py from docs/eri-backlog.json.
# Do not edit by hand -- regenerate, or the claimable IDs drift away
# from ERI's own document.
name: "P3 attempt — Job Coach Connection"
description: "Declare an attempt at ERI project 3 and claim the backlog IDs it will cover. Several teams may attempt P3; attempts are compared, never merged into each other."
title: "[P3] "
labels:
  - "attempt"
  - "project:p3"
body:
  - type: markdown
    attributes:
      value: "### P3: Job Coach Connection\n\nERI's own words for this project are in `docs/eri-problem-statements.md`, under \"Project 3: Job Coach Connection\". Where this form and that document disagree, the document wins and this form is a bug.\n\nTick the requirements this attempt will cover. Claim what you intend to finish, not everything that looks interesting: an attempt claiming six features and landing two is harder to judge than one claiming two and landing two."

  - type: input
    id: team
    attributes:
      label: "Team or attempt name"
      description: "Goes in your branch name: attempt/<team>/p3-<short-thing>"
    validations:
      required: true

  - type: textarea
    id: outcome
    attributes:
      label: "What a person will be able to do"
      description: "One or two plain sentences, about the person using it. No architecture, no stack."
    validations:
      required: true

  - type: checkboxes
    id: features
    attributes:
      label: "Core features claimed (7 available)"
      description: "ERI's core-features table for this project, verbatim. The ID before the dash is what your pull request and your tests cite."
      options:
        - label: "P3-F1 — Request help: Provide a clearly labeled \"I Need Help\" option."
        - label: "P3-F2 — Select support need: Offer choices such as \"I have a question,\" \"I don't understand a task,\" or \"My schedule changed.\""
        - label: "P3-F3 — Multiple communication options: Allow text, predefined messages, and picture-based selections."
        - label: "P3-F4 — Send request: Deliver the request to a designated job coach or simulated coach inbox."
        - label: "P3-F5 — View request status: Display whether the request has been sent, seen, or answered."
        - label: "P3-F6 — Job coach response: Allow the coach to send a short written or predefined response."
        - label: "P3-F7 — Communication history: Allow the employee to review messages within the current session."

  - type: checkboxes
    id: stories
    attributes:
      label: "User stories claimed (5 available)"
      description: "ERI's user stories for this project, verbatim."
      options:
        - label: "P3-US1 — As an employee, I want to ask for help using pictures because typing messages can be difficult."
        - label: "P3-US2 — As an employee, I want to know when my job coach has received my request."
        - label: "P3-US3 — As a job coach, I want to see what type of help someone needs before contacting them."
        - label: "P3-US4 — As an employee, I want a simple way to explain that I am confused or that something unexpected happened."
        - label: "P3-US5 — As a job coach, I want to respond with a short, clear message that is easy to understand."

  - type: input
    id: spec_ids
    attributes:
      label: "Frozen-spec IDs this attempt answers (optional)"
      description: "From challenges/p3-*/spec/acceptance.md, if it exists yet: MVP steps, accessibility requirements, success criteria, prohibitions. These are what the attempt is CHECKED against, as opposed to the backlog IDs above, which are what it claims to build. Both belong in the pull request body."
      placeholder: "P3-M3, P3-A4, P3-S1"

  - type: textarea
    id: non_text
    attributes:
      label: "Alternatives to typing, and to reading"
      description: "All four of ERI's projects require an alternative to typed input, and text alternatives for anything that is not text. Say what yours will be: pictures, audio, predefined choices, transcripts, captions."
    validations:
      required: true

  - type: checkboxes
    id: prohibitions
    attributes:
      label: "ERI's prohibitions"
      description: "ERI wrote these. They are not negotiable for a prototype, and they are not a reviewer's job to discover on the last afternoon."
      options:
        - label: "No field, question or required step asks for a disability or diagnosis."
          required: true
        - label: "Nothing scores or ranks candidates."
          required: true
        - label: "Nothing makes an automated hiring or accommodation decision — a person decides."
          required: true

  - type: textarea
    id: known_hard
    attributes:
      label: "Anything you already know will be hard"
      description: "Optional, and the most useful box on this form. Naming the risk up front is how your pull request gets read fairly."
