# Generated by tools/gen_issue_forms.py from docs/eri-backlog.json.
# Do not edit by hand -- regenerate, or the claimable IDs drift away
# from ERI's own document.
name: "P4 attempt — Employer Opportunity & Support Hub"
description: "Declare an attempt at ERI project 4 and claim the backlog IDs it will cover. Several teams may attempt P4; attempts are compared, never merged into each other."
title: "[P4] "
labels:
  - "attempt"
  - "project:p4"
body:
  - type: markdown
    attributes:
      value: "### P4: Employer Opportunity & Support Hub\n\nERI's own words for this project are in `docs/eri-problem-statements.md`, under \"Project 4: Employer Opportunity & Support Hub\". Where this form and that document disagree, the document wins and this form is a bug.\n\nTick the requirements this attempt will cover. Claim what you intend to finish, not everything that looks interesting: an attempt claiming six features and landing two is harder to judge than one claiming two and landing two."

  - type: input
    id: team
    attributes:
      label: "Team or attempt name"
      description: "Goes in your branch name: attempt/<team>/p4-<short-thing>"
    validations:
      required: true

  - type: textarea
    id: outcome
    attributes:
      label: "What a person will be able to do"
      description: "One or two plain sentences, about the person using it. No architecture, no stack."
    validations:
      required: true

  - type: checkboxes
    id: features
    attributes:
      label: "Core features claimed (7 available)"
      description: "ERI's core-features table for this project, verbatim. The ID before the dash is what your pull request and your tests cite."
      options:
        - label: "P4-F1 — Employer needs assessment: Allow employers to describe their business, staffing needs, and job tasks."
        - label: "P4-F2 — Skills-to-tasks matching: Identify potential connections between candidate strengths and workplace responsibilities."
        - label: "P4-F3 — Job task development: Help employers explore combinations of tasks that could create meaningful employment opportunities."
        - label: "P4-F4 — Disclosure guidance: Offer examples and explanations of appropriate employer responses to disability disclosures."
        - label: "P4-F5 — Accommodation explorer: Suggest possible accommodations and connect users to authoritative resources."
        - label: "P4-F6 — Onboarding planner: Create a simple checklist for training, communication, and workplace supports."
        - label: "P4-F7 — Resource connections: Provide links to JAN, EEOC, DVR, and other trusted resources."

  - type: checkboxes
    id: stories
    attributes:
      label: "User stories claimed (5 available)"
      description: "ERI's user stories for this project, verbatim."
      options:
        - label: "P4-US1 — As an employer, I want to understand how a candidate's skills could meet my business needs."
        - label: "P4-US2 — As a hiring manager, I want to know how to respond when an applicant discloses a disability."
        - label: "P4-US3 — As a supervisor, I want practical ideas for adapting how work tasks are taught or completed."
        - label: "P4-US4 — As an employer, I want help understanding accommodation requests without making assumptions about a person's disability."
        - label: "P4-US5 — As a job developer, I want a tool that helps facilitate conversations with employers about potential job opportunities."

  - type: input
    id: spec_ids
    attributes:
      label: "Frozen-spec IDs this attempt answers (optional)"
      description: "From challenges/p4-*/spec/acceptance.md, if it exists yet: MVP steps, accessibility requirements, success criteria, prohibitions. These are what the attempt is CHECKED against, as opposed to the backlog IDs above, which are what it claims to build. Both belong in the pull request body."
      placeholder: "P4-M3, P4-A4, P4-S1"

  - type: textarea
    id: non_text
    attributes:
      label: "Alternatives to typing, and to reading"
      description: "All four of ERI's projects require an alternative to typed input, and text alternatives for anything that is not text. Say what yours will be: pictures, audio, predefined choices, transcripts, captions."
    validations:
      required: true

  - type: checkboxes
    id: prohibitions
    attributes:
      label: "ERI's prohibitions"
      description: "ERI wrote these. They are not negotiable for a prototype, and they are not a reviewer's job to discover on the last afternoon."
      options:
        - label: "No field, question or required step asks for a disability or diagnosis."
          required: true
        - label: "Nothing scores or ranks candidates."
          required: true
        - label: "Nothing makes an automated hiring or accommodation decision — a person decides."
          required: true

  - type: textarea
    id: known_hard
    attributes:
      label: "Anything you already know will be hard"
      description: "Optional, and the most useful box on this form. Naming the risk up front is how your pull request gets read fairly."
