# Generated by tools/gen_issue_forms.py from docs/eri-backlog.json.
# Do not edit by hand -- regenerate, or the claimable IDs drift away
# from ERI's own document.
name: "P2 attempt — My Workday Assistant"
description: "Declare an attempt at ERI project 2 and claim the backlog IDs it will cover. Several teams may attempt P2; attempts are compared, never merged into each other."
title: "[P2] "
labels:
  - "attempt"
  - "project:p2"
body:
  - type: markdown
    attributes:
      value: "### P2: My Workday Assistant\n\nERI's own words for this project are in `docs/eri-problem-statements.md`, under \"Project 2: My Workday Assistant\". Where this form and that document disagree, the document wins and this form is a bug.\n\nTick the requirements this attempt will cover. Claim what you intend to finish, not everything that looks interesting: an attempt claiming six features and landing two is harder to judge than one claiming two and landing two."

  - type: input
    id: team
    attributes:
      label: "Team or attempt name"
      description: "Goes in your branch name: attempt/<team>/p2-<short-thing>"
    validations:
      required: true

  - type: textarea
    id: outcome
    attributes:
      label: "What a person will be able to do"
      description: "One or two plain sentences, about the person using it. No architecture, no stack."
    validations:
      required: true

  - type: checkboxes
    id: features
    attributes:
      label: "Core features claimed (8 available)"
      description: "ERI's core-features table for this project, verbatim. The ID before the dash is what your pull request and your tests cite."
      options:
        - label: "P2-F1 — Create a task: Add a workplace task and describe its steps."
        - label: "P2-F2 — Visual instructions: Include an image or icon for each step."
        - label: "P2-F3 — Audio support: Allow users to hear task instructions."
        - label: "P2-F4 — Step-by-step navigation: Show one step at a time with Back and Next controls."
        - label: "P2-F5 — Task completion: Allow workers to mark individual steps or tasks complete."
        - label: "P2-F6 — Daily routine: Display a simple list of assigned tasks for the day."
        - label: "P2-F7 — Reminders: Provide optional reminders or prompts for scheduled activities."
        - label: "P2-F8 — Request help: Provide an easy way to indicate when assistance is needed."

  - type: checkboxes
    id: stories
    attributes:
      label: "User stories claimed (5 available)"
      description: "ERI's user stories for this project, verbatim."
      options:
        - label: "P2-US1 — As an employee, I want to see pictures showing each step of a task so I can complete it without asking my supervisor repeatedly."
        - label: "P2-US2 — As an employee, I want to listen to instructions rather than read them."
        - label: "P2-US3 — As a job coach, I want to quickly create a task checklist for someone I support."
        - label: "P2-US4 — As a supervisor, I want to update instructions when a process changes."
        - label: "P2-US5 — As an employee, I want to indicate that I need help without feeling embarrassed."

  - type: input
    id: spec_ids
    attributes:
      label: "Frozen-spec IDs this attempt answers (optional)"
      description: "From challenges/p2-*/spec/acceptance.md, if it exists yet: MVP steps, accessibility requirements, success criteria, prohibitions. These are what the attempt is CHECKED against, as opposed to the backlog IDs above, which are what it claims to build. Both belong in the pull request body."
      placeholder: "P2-M3, P2-A4, P2-S1"

  - type: textarea
    id: non_text
    attributes:
      label: "Alternatives to typing, and to reading"
      description: "All four of ERI's projects require an alternative to typed input, and text alternatives for anything that is not text. Say what yours will be: pictures, audio, predefined choices, transcripts, captions."
    validations:
      required: true

  - type: checkboxes
    id: prohibitions
    attributes:
      label: "ERI's prohibitions"
      description: "ERI wrote these. They are not negotiable for a prototype, and they are not a reviewer's job to discover on the last afternoon."
      options:
        - label: "No field, question or required step asks for a disability or diagnosis."
          required: true
        - label: "Nothing scores or ranks candidates."
          required: true
        - label: "Nothing makes an automated hiring or accommodation decision — a person decides."
          required: true

  - type: textarea
    id: known_hard
    attributes:
      label: "Anything you already know will be hard"
      description: "Optional, and the most useful box on this form. Naming the risk up front is how your pull request gets read fairly."
